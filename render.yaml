services:
  - type: web
    name: saferoute-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 backend.api.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAFEROUTE_LITE_GRAPH
        value: "1"
      - key: SAFEROUTE_RELEASE_GRAPH_EDGES
        value: "1"
      - key: SAFEROUTE_DISK_CACHE
        value: "0"
    healthCheckPath: /health
